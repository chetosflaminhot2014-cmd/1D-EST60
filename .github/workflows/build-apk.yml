name: Crear APK de 1D EST60

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "style.css"
      - "script.js"
      - "logo.png"
      - "icon-192.svg"
      - "icon-512.svg"
      - "manifest.json"
      - "android/app-extras.js"
      - "android/app-extras.css"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar SDK de Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar archivos web locales
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html acceso.html programador.html style.css script.js logo.png manifest.json icon-192.svg icon-512.svg android/app-extras.js android/app-extras.css android/app/src/main/assets/www/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/www/index.html")
          html = p.read_text(encoding="utf-8")
          # El botón para descargar el APK solo debe aparecer en la web, nunca dentro de la App.
          import re
          html, removed = re.subn(
              r"\s*<a\b[^>]*\bid=['\"]downloadAppButton['\"][^>]*>.*?</a>",
              '',
              html,
              count=1,
              flags=re.S
          )
          if removed != 1:
              raise SystemExit("No se encontró el botón Descargar App para quitarlo de la aplicación")
          marker = '<script src="script.js"></script>'
          inject = '<script src="offline-mode.js"></script>\n    ' + marker + '\n    <script src="app-extras.js"></script>'
          if marker not in html:
              raise SystemExit("No se encontró la etiqueta script.js en index.html")
          html = html.replace(marker, inject, 1)
          head_marker = '</head>'
          if head_marker not in html:
              raise SystemExit("No se encontró el cierre head en index.html")
          html = html.replace(head_marker, '    <link rel="stylesheet" href="app-extras.css">\n' + head_marker, 1)
          p.write_text(html, encoding="utf-8")
          Path("android/app/src/main/assets/www/offline-mode.js").write_text(
              Path("android/offline-mode.js").read_text(encoding="utf-8"),
              encoding="utf-8"
          )
          PY

      - name: Crear iconos Android usando el logo original
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open("logo.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("android/app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (13, 26, 42, 255))
              # Recorta y escala el logo para llenar todo el icono, sin bordes vacíos.
              image = ImageOps.fit(
                  source,
                  (size, size),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5)
              )
              canvas.alpha_composite(image, (0, 0))
              canvas.convert("RGB").save(target / "ic_launcher.png", quality=95)
          PY

      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon -PappVersionCode=${{ github.run_number }} assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: 1D-EST60-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK como descarga de la última versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest >/dev/null 2>&1; then
            echo "La publicación latest ya existe; se actualizará el APK."
          else
            gh release create latest --title "1°D EST60 - Última versión" --notes "Descarga siempre la versión más reciente de la aplicación Android de 1°D EST60."
          fi
          # Elimina el nombre anterior y reemplaza el APK con el nombre limpio.
          gh release delete-asset latest app-debug.apk --yes 2>/dev/null || true
          gh release delete-asset latest 1D-EST60.apk --yes 2>/dev/null || true
          cp "$APK_PATH" /tmp/1D-EST60.apk
          gh release upload latest /tmp/1D-EST60.apk
          printf '{"versionCode":%s,"versionName":"1.0.%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > /tmp/version.json
          gh release delete-asset latest version.json --yes 2>/dev/null || true
          gh release upload latest /tmp/version.json
