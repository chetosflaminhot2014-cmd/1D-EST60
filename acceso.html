<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso limitado | 1°D</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="access-page">
    <main class="programmer-login">
        <div class="login-left">
            <div class="lock-container">
                <div class="lock-shackle"></div>
                <div class="lock-body"><div class="lock-hole"></div></div>
                <div class="lock-password"><span>*****</span><span class="cursor">|</span></div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-content">
                <span class="login-kicker">MENÚ DE ADMINISTRADOR · 1°D EST60</span>
                <h1>Menú de Administrador</h1>
                <p class="login-description">Ingresa tu clave para continuar al panel de administración.</p>
                <form id="programmerLogin">
                    <input type="password" id="programmerPassword" placeholder="Introduce la contraseña" autocomplete="current-password" required>
                    <button type="submit" class="login-button">Iniciar sesión</button>
                </form>
                <p id="loginError" class="login-error"></p>
                <a href="index.html" class="back-home">Volver a <span>Inicio</span></a>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "https://oned-est60-server.onrender.com";
        const loginForm = document.getElementById("programmerLogin");
        const passwordInput = document.getElementById("programmerPassword");
        const loginError = document.getElementById("loginError");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginError.textContent = "Verificando acceso...";

            try {
                const response = await fetch(`${API_BASE}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "No se pudo verificar el acceso.");
                }
                sessionStorage.setItem("est60_admin_key", passwordInput.value);
                window.location.href = "programador.html";
            } catch (error) {
                loginError.textContent = error.message || "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
